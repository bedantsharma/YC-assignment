[project]
name = "floorplan"
version = "0.1.0"
description = "Phone captures (LiDAR, video, photos) to dimensioned floor plans"
readme = "README.md"
authors = [
    { name = "Bedant sharma", email = "manurishi1103@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[project.scripts]
floorplan = "floorplan.cli:main"

[project.optional-dependencies]
video = [
    "mapanything",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.uv.sources]
mapanything = { git = "https://github.com/facebookresearch/map-anything", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }
